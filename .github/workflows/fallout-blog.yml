name: Fallout Blog Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || 'gemini-2.0-flash-lite' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      REDDIT_FETCH_DELAY_MS: 6000
      REDDIT_RATE_LIMIT_BACKOFF_MS: 8000
      REDDIT_SUBREDDITS: fallout,FalloutMods
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore story history
        uses: actions/cache@v4
        with:
          path: data/story-history.json
          key: story-history-v1-${{ github.repository }}
          restore-keys: |
            story-history-v1-${{ github.repository }}

      - name: Restore feed health
        uses: actions/cache@v4
        with:
          path: data/feed-health.json
          key: feed-health-v1-${{ github.repository }}
          restore-keys: |
            feed-health-v1-${{ github.repository }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Fallout draft
        run: npm run fallout:generate

      - name: Save story history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/story-history.json
          key: story-history-v1-${{ github.repository }}

      - name: Save feed health cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/feed-health.json
          key: feed-health-v1-${{ github.repository }}
