name: Fallout Blog Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: fallout-blog-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
      GEMINI_API_KEY_FALLBACK_2: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
      GEMINI_MODEL_CHAIN: ${{ vars.GEMINI_MODEL_CHAIN || '' }}
      REDDIT_CUSTOM_FEED_URL: ${{ secrets.REDDIT_CUSTOM_FEED_URL }}
      REDDIT_FETCH_DELAY_MS: 6000
      REDDIT_RATE_LIMIT_BACKOFF_MS: 8000
      # Manual Blogger: HTML packages land in posts/No.NN - Title.html (no API)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair story history if conflicted
        run: npm run fallout:repair-history

      - name: Generate Fallout draft
        run: npm run fallout:generate

      - name: Commit pipeline state
        if: always()
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run fallout:commit-state
