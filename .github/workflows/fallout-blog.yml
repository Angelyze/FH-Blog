name: Fallout Blog Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: fallout-blog-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
      GEMINI_API_KEY_FALLBACK_2: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
      GEMINI_MODEL_CHAIN: ${{ vars.GEMINI_MODEL_CHAIN || '' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      REDDIT_CUSTOM_FEED_URL: ${{ secrets.REDDIT_CUSTOM_FEED_URL }}
      REDDIT_FETCH_DELAY_MS: 6000
      REDDIT_RATE_LIMIT_BACKOFF_MS: 8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair story history if conflicted
        run: npm run fallout:repair-history

      - name: Generate Fallout draft
        run: npm run fallout:generate

      - name: Commit pipeline state
        if: always()
        run: |
          npm run fallout:repair-history
          if ! git diff --quiet -- data/story-history.json data/feed-health.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/story-history.json data/feed-health.json
            git commit -m "chore(blog): update pipeline state"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
            echo "Pipeline state committed to repository."
          else
            echo "No pipeline data changes to commit."
          fi
